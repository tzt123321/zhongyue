version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: zhongyue_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-zhongyue}
      POSTGRES_USER: ${DB_USER:-zhongyue}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-zhongyue}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: zhongyue-api:latest
    container_name: zhongyue_api
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-zhongyue}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: ${DB_NAME:-zhongyue}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      PORT: ${API_PORT:-7800}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_INVITE_CODE: ${ADMIN_INVITE_CODE:-ADMIN2026}
      DATA_PATH: /data
    ports:
      - "${API_PORT:-7800}:7800"
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    volumes:
      - ${MUSIC_PATH:-./music}:/music:ro
      - ./data:/data

  stream:
    image: zhongyue-stream:latest
    container_name: zhongyue_stream
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-zhongyue}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: ${DB_NAME:-zhongyue}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      PORT: ${STREAM_PORT:-8081}
    ports:
      - "${STREAM_PORT:-8081}:8081"
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    volumes:
      - ${MUSIC_PATH:-./music}:/music:ro


  nginx:
    image: nginx:alpine
    container_name: zhongyue_nginx
    ports:
      - "${HTTP_PORT:-8088}:80"
    depends_on:
      - api
      - stream
    restart: unless-stopped
    volumes:
      - ./frontend-dist:/var/www/dist:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data:/var/www/data:ro

volumes:
  postgres-data: