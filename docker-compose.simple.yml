# 众乐 (ZhongYue) — 简化版 docker-compose（无需手动预编译）
#
# 使用方式：
#   1. cp .env.example .env
#   2. mkdir -p ./music
#   3. sudo docker compose -f docker-compose.simple.yml up -d
#
# 构建镜像（首次运行自动执行）：
#   sudo docker build -f Dockerfile.simple -t zhongyue:latest .

services:
  postgres:
    image: postgres:16-alpine
    container_name: zhongyue_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-zhongyue}
      POSTGRES_USER: ${DB_USER:-zhongyue}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zhongyue_secret_pass}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-zhongyue} -d ${DB_NAME:-zhongyue}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: zhongyue_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: zhongyue_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=zhongyue-search
      - TZ=Asia/Shanghai
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "${ES_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    image: zhongyue:latest
    container_name: zhongyue_api
    restart: unless-stopped
    # FIXED: 移除 command 覆盖，让 ENTRYPOINT (/entrypoint.sh) 正常执行
    # entrypoint 会先运行 migrate，再启动 api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-zhongyue}
      - DB_PASSWORD=${DB_PASSWORD:-zhongyue_secret_pass}
      - DB_NAME=${DB_NAME:-zhongyue}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ES_HOST=http://elasticsearch:9200
      - SECRET_KEY=${SECRET_KEY:-change-me}
      - MUSIC_PATH=/music
      - DATA_PATH=/data
      - SERVER_PORT=7800
      - TZ=Asia/Shanghai
      # FIXED: 添加管理员账号环境变量
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - ADMIN_INVITE_CODE=${ADMIN_INVITE_CODE:-ADMIN2026}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
    volumes:
      - ./data:/data
      - ${MUSIC_PATH:-./music}:/music:ro
    ports:
      - "${API_PORT:-7800}:7800"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7800/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  stream:
    image: zhongyue:latest
    container_name: zhongyue_stream
    restart: unless-stopped
    # stream 二进制独立运行，不需要 migrate，直接执行二进制跳过 entrypoint
    entrypoint: ["/app/stream"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-zhongyue}
      - DB_PASSWORD=${DB_PASSWORD:-zhongyue_secret_pass}
      - DB_NAME=${DB_NAME:-zhongyue}
      - MUSIC_PATH=/music
    volumes:
      - ${MUSIC_PATH:-./music}:/music:ro
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  nginx:
    image: nginx:alpine
    container_name: zhongyue_nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      stream:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend-dist:/var/www/dist:ro
      - ${MUSIC_PATH:-./music}:/music:ro
      - nginx_cache:/var/cache/nginx
    ports:
      - "${HTTP_PORT:-8088}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  es_data:
  music_data:
  nginx_cache:
